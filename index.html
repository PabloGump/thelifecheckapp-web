<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeCheck — your whole life, in one score</title>
<meta name="description" content="LifeCheck tracks the recurring real-world tasks that are easy to forget — and turns them into a single Life Score.">
<meta name="theme-color" content="#16A34A">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:title" content="LifeCheck">
<meta property="og:description" content="Your whole life, in one score.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thelifecheckapp.com">
<meta property="og:image" content="https://thelifecheckapp.com/icon.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* Tokens mirror src/constants/theme.js — LIGHT and DARK. */
  :root{
    --bg:#F4F7F5; --text:#0A2E1A; --muted:#4B5563;
    --primary:#16A34A; --primary-text:#15803D; --on-primary:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#060F09; --text:#F0FAF4; --muted:#C7D6CC;
      --primary:#4ADE80; --primary-text:#86EFAC; --on-primary:#06210F;
    }
  }

  body{
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100svh; padding:32px 20px; text-align:center;
  }
  .wrap{max-width:520px}

  /* The real app icon, not an approximation. Rendered from the master
     1024 PNG so the squircle, the ring gradient and the gap are exactly
     what ships on the home screen. */
  .icon{width:84px;height:84px;display:block;margin:0 auto 24px;border-radius:19px}

  /* Two-tone wordmark, per assets/WORDMARK_SPEC.md. The light file is for
     light backgrounds and the dark file for dark ones — swap, don't recolour. */
  .wordmark{width:210px;height:auto;display:block;margin:0 auto 18px}
  .wordmark.on-light{display:block}
  .wordmark.on-dark{display:none}
  @media (prefers-color-scheme:dark){
    .wordmark.on-light{display:none}
    .wordmark.on-dark{display:block}
  }

  .lede{font-size:clamp(17px,3.4vw,20px);color:var(--text);margin-bottom:10px;font-weight:600}
  .sub{font-size:15px;color:var(--muted);margin-bottom:32px}
  .cta{
    display:inline-block;background:var(--primary);color:var(--on-primary);
    text-decoration:none;font-weight:600;font-size:16px;
    padding:15px 34px;border-radius:999px;
  }
  .cta:hover{opacity:.92}
  .foot{margin-top:44px;font-size:13px;color:var(--muted)}
  .foot a{color:var(--primary-text)}
  .foot a+a{margin-left:18px}
</style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="icon.png" alt="LifeCheck app icon" width="84" height="84">
    <img class="wordmark on-light" src="wordmark-light.svg" alt="LifeCheck">
    <img class="wordmark on-dark"  src="wordmark-dark.svg"  alt="LifeCheck">
    <p class="lede">Your whole life, in one score.</p>
    <p class="sub">
      The recurring things that are easy to forget — the filter, the rotation,
      the check-up — tracked in one place, and turned into a single number you
      can actually move.
    </p>
    <a class="cta" href="https://apps.apple.com/app/id6763495073">Download on the App&nbsp;Store</a>
    <p class="foot">
      <a href="https://pablogump.github.io/lifecheck-privacy">Privacy</a>
      <a href="mailto:thelifecheckapp@gmail.com">Support</a>
    </p>
  </div>
</body>
</html>
