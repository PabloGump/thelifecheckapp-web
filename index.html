<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeCheck — your whole life, in one score</title>
<meta name="description" content="LifeCheck tracks the recurring real-world tasks that are easy to forget — and turns them into a single Life Score.">
<meta name="theme-color" content="#16A34A">
<meta property="og:title" content="LifeCheck">
<meta property="og:description" content="Your whole life, in one score.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thelifecheckapp.com">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F4F7F5; --surface:#FFFFFF; --text:#0A2E1A; --muted:#4B5563;
    --primary:#16A34A; --primary-text:#15803D; --border:rgba(10,46,26,.10); --on-primary:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#060F09;--surface:#0A2E1A;--text:#F0FAF4;--muted:#C7D6CC;
          --primary:#4ADE80;--primary-text:#86EFAC;--border:rgba(255,255,255,.12);--on-primary:#06210F}
  }
  body{
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;padding:32px 20px;text-align:center;
  }
  .wrap{max-width:520px}
  .mark{
    width:76px;height:76px;border-radius:20px;margin:0 auto 26px;
    background:linear-gradient(145deg,var(--primary),#F59E0B);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 28px rgba(22,163,74,.22);
  }
  .mark span{
    width:40px;height:40px;border-radius:50%;
    border:7px solid var(--surface);border-right-color:transparent;
    transform:rotate(-45deg);
  }
  h1{font-size:clamp(30px,7vw,42px);letter-spacing:-1.1px;font-weight:800;margin-bottom:12px}
  h1 .a{color:var(--text)} h1 .b{color:var(--primary-text)}
  .lede{font-size:clamp(17px,3.4vw,20px);color:var(--muted);margin-bottom:8px;font-weight:500}
  .sub{font-size:15px;color:var(--muted);margin-bottom:32px}
  .cta{
    display:inline-block;background:var(--primary);color:var(--on-primary);
    text-decoration:none;font-weight:600;font-size:16px;
    padding:15px 34px;border-radius:999px;
  }
  .cta:hover{opacity:.92}
  .foot{margin-top:44px;font-size:13px;color:var(--muted)}
  .foot a{color:var(--primary-text)}
  .foot a+a{margin-left:18px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span></span></div>
    <h1><span class="a">Life</span><span class="b">Check</span></h1>
    <p class="lede">Your whole life, in one score.</p>
    <p class="sub">
      The recurring things that are easy to forget — the filter, the rotation,
      the check-up — tracked in one place, and turned into a single number you
      can actually move.
    </p>
    <a class="cta" href="https://apps.apple.com/app/id6763495073">Download on the App&nbsp;Store</a>
    <p class="foot">
      <a href="https://pablogump.github.io/lifecheck-privacy">Privacy</a>
      <a href="mailto:thelifecheckapp@gmail.com">Support</a>
    </p>
  </div>
</body>
</html>
