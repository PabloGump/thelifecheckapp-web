<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeCheck</title>
<meta name="description" content="LifeCheck tracks the recurring real-world tasks that are easy to forget, and turns them into a single Life Score.">
<meta name="theme-color" content="#16A34A">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:title" content="LifeCheck">
<meta property="og:description" content="Your whole life, in one score.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thelifecheckapp.com">
<meta property="og:image" content="https://thelifecheckapp.com/icon.png">

<!-- Plus Jakarta Sans, the wordmark face. The wordmark SVGs in assets/ are
     <text> elements referencing this family, so without the webfont a browser
     silently falls back to Arial: wrong shapes, and a narrower render that
     leaves whitespace inside the 480-wide viewBox, which pushed the visible
     wordmark left of centre. Loading the font and setting the wordmark as HTML
     text avoids both problems and is what the privacy policy page already does. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* Tokens mirror src/constants/theme.js, LIGHT and DARK. */
  :root{
    --bg:#F4F7F5; --text:#0A2E1A; --muted:#69707E;
    --primary:#16A34A; --primary-text:#15803D; --on-primary:#FFFFFF;
    --wordmark-life:#0A2E1A; --wordmark-check:#16A34A;
    --ring-track:#16A34A;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#060F09; --text:rgba(255,255,255,0.85); --muted:rgba(255,255,255,0.55);
      --primary:#4ADE80; --primary-text:#86EFAC; --on-primary:#06210F;
      --wordmark-life:#FFFFFF; --wordmark-check:#4ADE80;
      --ring-track:#4ADE80;
    }
  }

  body{
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:16px; line-height:1.6;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; align-items:center; justify-content:center;
    min-height:100svh; padding:32px 20px;
  }
  .wrap{max-width:520px; width:100%; text-align:center}

  /* Ring mark, no squircle. The app icon's background rect is for the iOS home
     screen; on a page it reads as a pasted-in app icon rather than a logo.
     Inlined rather than <img> so the track can inherit currentColor. */
  .ring{width:78px;height:78px;display:block;margin:0 auto 22px;color:var(--ring-track)}

  /* Two-tone wordmark per assets/WORDMARK_SPEC.md: Plus Jakarta Sans 700,
     tracking -0.03em of the font size. */
  .wordmark{
    font-weight:700; font-size:clamp(34px,8vw,46px); line-height:1;
    letter-spacing:-0.03em; margin-bottom:20px;
  }
  .wordmark .life{color:var(--wordmark-life)}
  .wordmark .check{color:var(--wordmark-check)}

  .lede{font-size:clamp(18px,3.6vw,21px);font-weight:600;margin-bottom:12px}
  .sub{font-size:15.5px;color:var(--muted);margin-bottom:34px}
  .cta{
    display:inline-block;background:var(--primary);color:var(--on-primary);
    text-decoration:none;font-weight:600;font-size:16px;
    padding:15px 34px;border-radius:999px;
  }
  .cta:hover{opacity:.92}
  .foot{margin-top:46px;font-size:13px;color:var(--muted)}
  .foot a{color:var(--primary-text)}
  .foot a+a{margin-left:18px}
</style>
</head>
<body>
  <div class="wrap">

    <svg class="ring" viewBox="102.5 102.5 819 819" role="img" aria-label="LifeCheck">
      <defs>
        <linearGradient id="dawnRing" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#F59E0B"/>
          <stop offset="22%"  stop-color="#F59E0B"/>
          <stop offset="38%"  stop-color="#D89318"/>
          <stop offset="50%"  stop-color="#9AAA28"/>
          <stop offset="62%"  stop-color="#3FA055"/>
          <stop offset="80%"  stop-color="#22C36B"/>
          <stop offset="100%" stop-color="#4ADE80"/>
        </linearGradient>
      </defs>
      <circle cx="512" cy="512" r="364" fill="none"
              stroke="currentColor" stroke-opacity="0.30" stroke-width="91"/>
      <circle cx="512" cy="512" r="364" fill="none"
              stroke="url(#dawnRing)" stroke-width="91" stroke-linecap="round"
              stroke-dasharray="1944.66 2287.83" transform="rotate(-90 512 512)"/>
    </svg>

    <div class="wordmark"><span class="life">Life</span><span class="check">Check</span></div>

    <p class="lede">Your whole life, in one score.</p>
    <p class="sub">
      The filter. The rotation. The check-up. All the recurring things that are
      easy to forget, tracked in one place and turned into a single number you
      can actually move.
    </p>

    <a class="cta" href="https://apps.apple.com/app/id6763495073">Download on the App&nbsp;Store</a>

    <p class="foot">
      <a href="https://pablogump.github.io/lifecheck-privacy">Privacy</a>
      <a href="mailto:thelifecheckapp@gmail.com">Support</a>
    </p>
  </div>
</body>
</html>
