<?xml version="1.0" encoding="UTF-8"?>
<!--
  LifeCheck wordmark — dark mode.
  Font: Plus Jakarta Sans 700. Tracking -0.03em.
  "Life" #FFFFFF,  "Check" #4ADE80.

  See wordmark-light.svg for notes on outlining before distributing
  to designers / App Store marketing.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="480" height="96"
     viewBox="0 0 480 96"
     shape-rendering="geometricPrecision">
  <text x="0" y="72"
        font-family="'Plus Jakarta Sans', 'PlusJakartaSans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="72"
        letter-spacing="-2.16"
        fill="#FFFFFF">Life<tspan fill="#4ADE80">Check</tspan></text>
</svg>
